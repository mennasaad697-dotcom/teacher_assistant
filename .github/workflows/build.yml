name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Teacher Assistant APK
        run: |
          cd /tmp
          flutter create teacher_app --org com.teacherassistant.app --project-name teacher_assistant
          cd teacher_app
          flutter pub add webview_flutter
          
          # تعديل إصدار أندرويد ليتوافق مع WebView
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' android/app/build.gradle
          sed -i 's/minSdk .*/minSdk = 21/g' android/app/build.gradle

          # كتابة كود تطبيق Jotform
          python3 -c "
          code = '''import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Teacher Assistant',
                home: WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('https://form.jotform.com/241834927233056'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }'''
          with open('lib/main.dart', 'w') as f:
              f.write(code.strip())
          "

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeacherAssistant-APK
          path: /tmp/teacher_app/build/app/outputs/flutter-apk/app-release.apk
