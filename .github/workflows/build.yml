name: Build Native App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create and Build App
        run: |
          cd /tmp
          flutter create teacher_app --org com.teacherassistant.app --project-name teacher_assistant
          cd teacher_app
          flutter build apk --release
          flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeacherAssistant-APK
          path: /tmp/teacher_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: TeacherAssistant-GooglePlay-AAB
          path: /tmp/teacher_app/build/app/outputs/bundle/release/app-release.aab
