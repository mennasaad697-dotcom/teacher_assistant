name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build App with Internet Permission
        run: |
          cd /tmp
          flutter create teacher_app --org com.teacherassistant.app --project-name teacher_assistant
          cd teacher_app
          flutter pub add webview_flutter

          # 1. إضافة إذن الإنترنت للأندرويد
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml

          # 2. ضبط minSdkVersion ليتوافق مع WebView
          python3 -c "
          import os, re
          files = ['android/app/build.gradle', 'android/app/build.gradle.kts']
          for fpath in files:
              if os.path.exists(fpath):
                  with open(fpath, 'r') as f:
                      c = f.read()
                  c = re.sub(r'minSdkVersion\s+.*', 'minSdkVersion 21', c)
                  c = re.sub(r'minSdk\s*=.*', 'minSdk = 21', c)
                  c = re.sub(r'flutter\.minSdkVersion', '21', c)
                  with open(fpath, 'w') as f:
                      f.write(c)
          "

          # 3. كتابة كود التطبيق
          python3 -c "
          code = '''import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() {
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                title: 'Teacher Assistant',
                home: WebViewScreen(),
              );
            }
          }

          class WebViewScreen extends StatefulWidget {
            const WebViewScreen({super.key});

            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('https://form.jotform.com/241834927233056'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(controller: controller),
                ),
              );
            }
          }'''
          with open('lib/main.dart', 'w') as f:
              f.write(code.strip())
          "

          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TeacherAssistant-APK
          path: /tmp/teacher_app/build/app/outputs/flutter-apk/app-release.apk
          
