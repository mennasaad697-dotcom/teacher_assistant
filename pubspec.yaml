name: teacher_assistant
description: "تطبيق إدارة المعلم والطالب والمدفوعات"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core Services
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  google_sign_in: ^6.2.1

  # State Management & Preferences
  provider: ^6.1.2
  shared_preferences: ^2.2.3

  # QR Code Scanning & Generation
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.13.0
  path_provider: ^2.1.3

  # Integrations & Utilities
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  intl: ^0.19.0
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
